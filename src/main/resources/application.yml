spring:
  ai:
    model:
      embedding: transformers
    embedding:
      transformer:
        onnx:
          model-uri: file:/Users/dhananjai_dj/models/all-MiniLM-L6-v2/model.onnx
        tokenizer:
          uri: file:/Users/dhananjai_dj/models/all-MiniLM-L6-v2/tokenizer.json
        cache:
          directory: /Users/dhananjai_dj/.cache/spring-ai-onnx
    openai:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: qwen/qwen3.8-27b
    mcp:
      server:
        name: cortex-kb-server
        version: 1.0.0
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
        type: sync
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 384
  datasource:
    url: jdbc:postgresql://localhost:5432/cortex
    username: username
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers:
      - localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: cortex-kb-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.project.*"
  application:
    name: Cortex